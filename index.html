<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - LSElectronic</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding-bottom: 40px; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 20px; text-align: center; }
        header h1 { color: #38bdf8; font-size: 28px; margin-bottom: 6px; }
        header p { color: #94a3b8; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .buscador { flex: 1; min-width: 240px; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; }
        .cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .cat-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
        .img-wrap { width: 100%; height: 210px; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; padding: 10px; }
        .img-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .sin-foto { color: #64748b; font-size: 14px; }
        .badge-cond { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .nuevo { background: #22c55e; color: #fff; }
        .usado { background: #f97316; color: #fff; }
        .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .cat-tag { color: #38bdf8; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
        .desc { color: #94a3b8; font-size: 13px; line-height: 1.4; margin-bottom: 14px; white-space: pre-line; flex: 1; }
        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-top: 10px; border-top: 1px solid #334155; }
        .price { font-size: 22px; font-weight: 800; color: #4ade80; }
        .stock-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .stock-low { background: rgba(234, 179, 8, 0.15); color: #facc15; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .btn-wsp { display: block; text-align: center; background: #25D366; color: #0f172a; text-decoration: none; font-weight: 700; padding: 11px; border-radius: 8px; font-size: 14px; transition: 0.2s; border: none; width: 100%; cursor: pointer; }
        .btn-wsp:hover { background: #1ebe5d; }
        .empty { text-align: center; color: #94a3b8; padding: 40px; grid-column: 1 / -1; }
    </style>
</head>

        const TEL_WSP = "5491159815332";
        let catActual = "Todas";
        function selCat(cat, btn) {
            catActual = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtrar();
        }

        function formatoPesoCatalogo(valor) {
            return "$ " + Math.round(Number(valor) || 0).toLocaleString("es-AR");
        }

        function filtrar() {
            const txt = document.getElementById('q').value.toLowerCase().trim();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const lista = PRODUCTOS.filter(p => {
                if (p.stock <= 0) return false;
                if (catActual !== "Todas" && p.categoria !== catActual) return false;
                if (txt && !(p.nombre + " " + p.descripcion + " " + p.categoria).toLowerCase().includes(txt)) return false;
                return true;
            });

            if (lista.length === 0) {
                grid.innerHTML = '<div class="empty">No se encontraron productos disponibles con ese filtro.</div>';
                return;
            }

            lista.forEach(p => {
                const stockTxt = p.stock > 5 ? "En stock" : p.stock + (p.stock === 1 ? " disponible" : " disponibles");
                const stockClass = p.stock > 5 ? "stock-ok" : "stock-low";
                const imgTag = p.foto ? '<img src="' + p.foto + '" alt="' + p.nombre + '">' : '<span class="sin-foto">Sin imagen</span>';
                const condClass = p.condicion === "Usado" ? "usado" : "nuevo";
                const precioFormateado = formatoPesoCatalogo(p.precio);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = '<div class="img-wrap">' + imgTag + '<span class="badge-cond ' + condClass + '">' + p.condicion + '</span></div>' +
                    '<div class="card-body">' +
                        '<div class="cat-tag">' + p.categoria + '</div>' +
                        '<div class="title">' + p.nombre + '</div>' +
                        '<div class="desc">' + (p.descripcion || '') + '</div>' +
                        '<div class="meta">' +
                            '<div class="price">' + precioFormateado + '</div>' +
                            '<div class="' + stockClass + '">' + stockTxt + '</div>' +
                        '</div>' +
                        '<button type="button" class="btn-wsp">💬 Consultar por WhatsApp</button>' +
                    '</div>';

                card.querySelector('.btn-wsp').onclick = function() {
                    const msg = encodeURIComponent("Hola! Quiero consultar por: " + p.nombre + " (" + precioFormateado + ")");
                    const base = "https:" + "//" + "api." + "whatsapp" + ".com/send";
                    const destino = TEL_WSP ? base + "?phone=" + TEL_WSP + "&text=" + msg : base + "?text=" + msg;
                    window.open(destino, "_blank");
                };

                grid.appendChild(card);
            });
        }
        filtrar();
    </script>
